server:
  port: 8080

spring:
  application:
    name: nxsh
  data:
    redis:
      host: localhost       # Redis 服务器地址
      port: 6380             # Redis 端口，默认是 6379
      password:             # 如果你的 Redis 设置了密码，填在这里；没有就留空
      database: 0           # 指定使用第 0 号数据库 (就是刚才建议的默认库)
      timeout: 3000ms       # 连接超时时间
  datasource:
    url: jdbc:mysql://localhost:3308/nxsh?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: gymmy666
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

