nxsh:
  tasks:
    blood-pressure-reminder:
      enabled: false
    medicine-reminder:
      enabled: false
    guardian-alert:
      enabled: false
    guardian-heartbeat-sync:
      enabled: false
    location-data-cleanup:
      enabled: false
